<div class="auth-page">
  <div class="auth-card">
    <h1>TaskFlow</h1>
    <p class="subtitle">Entre na sua conta para gerenciar suas tarefas.</p>

    <form [formGroup]="form" (ngSubmit)="entrar()">
      <label>Email</label>
      <input type="email" formControlName="email" placeholder="seuemail@exemplo.com" />

      <label>Senha</label>
      <input type="password" formControlName="senha" placeholder="Digite sua senha" />

      <button type="submit">Entrar</button>
    </form>

    <p class="link-text">
      Não tem conta?
      <a routerLink="/register">Criar conta</a>
    </p>
  </div>
</div>
